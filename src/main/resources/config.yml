# YLevelHider Configuration

# ==========================================================================================
# IMPORTANT DISCLAIMER: World Whitelist
# ==========================================================================================
# It is STRONGLY RECOMMENDED NOT to add Nether ('your_world_nether') or End ('your_world_the_end')
# dimensions to the 'whitelisted-worlds' list below.
# Modifying chunk data in these dimensions, especially around bedrock layers, portals,
# or unique generation features, can lead to severe visual glitches, client crashes,
# or unexpected gameplay behavior.
#
# This plugin is primarily designed and tested for Overworld-like dimensions.
# If you choose to enable it in Nether/End worlds, do so at your own risk and test thoroughly.
# ==========================================================================================

# List of worlds where the Y-level hiding effect will be active.
# Add the exact names of your worlds here as they appear in your server's root folder.
# For example:
# whitelisted-worlds:
#   - "world"
#   - "my_custom_mining_world"
#   - "resource_dimension_alpha"

whitelisted-worlds:
  - "world" # Default Overworld name, adjust if yours is different
# - "world_nether" # NOT RECOMMENDED
# - "world_the_end"  # NOT RECOMMENDED

# Cooldown in seconds between chunk refreshes for the same player
# Higher values reduce server load but may delay visual updates
refresh-cooldown-seconds: 3

# State validation interval in seconds (for Folia compatibility)
# This task periodically checks and corrects player states to mitigate
# missed events in Folia's async environment. Lower values provide better
# responsiveness but use more server resources.
state-validation-interval-seconds: 10

# ==========================================================================================
# Enhanced Anti-Xray Features
# ==========================================================================================

# Hide entities below Y=30 when players are above Y=31
# This prevents ESP hacks from seeing entities like armor stands underground
hide-entities-below-y30: true

# Material to use for fake blocks (default: deepslate)
# Valid materials: DEEPSLATE, STONE, COBBLESTONE, etc.
# Note: Must be a valid Minecraft material name
fake-block-material: "DEEPSLATE"

# Detection range for looking at fake blocks (in blocks)
# When players look at fake blocks within this range, chunks are uncovered
# Higher values = more responsive but more resource intensive
look-detection-range: 5

# Interval in ticks for checking player look direction (20 ticks = 1 second)
# Lower values = more responsive uncovering but higher CPU usage
look-check-interval-ticks: 10