# Dependency update workflow to keep dependencies current
name: Dependency Updates

on:
  schedule:
    # Run weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Check for outdated dependencies
      run: |
        echo "🔍 Checking for outdated dependencies..."
        mvn versions:display-dependency-updates
        mvn versions:display-plugin-updates
    
    - name: Check Maven wrapper version
      run: |
        if [ -f "mvnw" ]; then
          echo "🔍 Maven wrapper found - checking version..."
          ./mvnw -version
        else
          echo "ℹ️  No Maven wrapper found in project"
        fi
    
    - name: Generate dependency tree
      run: |
        echo "📋 Generating dependency tree..."
        mvn dependency:tree -DoutputFile=dependency-tree.txt
    
    - name: Upload dependency report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-report
        path: |
          dependency-tree.txt
        retention-days: 30
    
    - name: Create summary
      run: |
        echo "## Dependency Check Summary" >> $GITHUB_STEP_SUMMARY
        echo "Dependency analysis completed. Check the artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
        echo "- Dependency tree: See uploaded artifact" >> $GITHUB_STEP_SUMMARY
        echo "- Maven plugins: Check action logs for update information" >> $GITHUB_STEP_SUMMARY