# Continuous Integration workflow for building and testing the project
name: CI

on:
  push:
    branches: [ master, main, test ]
  pull_request:
    branches: [ master, main, test ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: [21]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    
    - name: Validate Maven POM
      run: mvn validate
    
    - name: Compile project
      run: mvn clean compile
    
    - name: Run tests (if any)
      run: mvn test
      continue-on-error: true  # Allow builds to succeed even if no tests exist
    
    - name: Build JAR
      run: mvn package -DskipTests
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifact-java-${{ matrix.java-version }}
        path: target/*.jar
        retention-days: 7
    
    - name: Check JAR file
      run: |
        echo "Generated JAR files:"
        ls -la target/*.jar || echo "No JAR files found"